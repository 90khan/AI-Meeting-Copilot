[package]
name = "ai-meeting-copilot"
version = "0.1.0"
description = "Privacy-first AI Meeting Copilot desktop application"
authors = ["AI Meeting Copilot"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "ai_meeting_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
